<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEPTHCRAWLER — 끝없는 하강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d0b14;
    --bg-panel:#171325;
    --bg-panel-2:#1f1a33;
    --line:#332c4d;
    --gold:#d9a84e;
    --gold-dim:#8a7238;
    --ember:#c0503a;
    --ember-bright:#e2704f;
    --moss:#5c8a6a;
    --moss-bright:#7fbf8f;
    --ink:#e9e3f0;
    --ink-dim:#9d94b3;
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #241d3a 0%, transparent 55%),
      radial-gradient(ellipse at 80% 110%, #201530 0%, transparent 55%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Spectral',Georgia,serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{
    font-family:'Cinzel',Georgia,serif;
    letter-spacing:.02em;
    font-weight:700;
    margin:0;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    padding:14px 14px 28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .topbar .brand{
    font-size:1.05rem;
    color:var(--gold);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .topbar .brand small{
    font-family:'Spectral',serif;
    font-weight:400;
    color:var(--ink-dim);
    font-size:.7rem;
  }
  .stat-chip{
    font-family:'Spectral',serif;
    font-size:.82rem;
    color:var(--ink-dim);
    display:flex;
    gap:14px;
  }
  .stat-chip b{color:var(--ink);font-weight:600;}
  .screen{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    box-shadow:var(--shadow);
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  /* ---------- Intro ---------- */
  .intro{align-items:center;text-align:center;justify-content:center;gap:22px;padding:36px 20px;}
  .intro h1{font-size:2.1rem;color:var(--gold);}
  .intro p{color:var(--ink-dim);max-width:44ch;line-height:1.6;font-size:.95rem;}
  .rule-list{
    text-align:left;
    color:var(--ink-dim);
    font-size:.85rem;
    line-height:1.7;
    max-width:40ch;
    border-left:2px solid var(--gold-dim);
    padding-left:14px;
  }
  .rule-list b{color:var(--ink);}
  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:.85rem;
    letter-spacing:.03em;
    color:var(--ink);
    background:linear-gradient(180deg,#2b2445,#221c39);
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px 20px;
    min-height:46px;
    cursor:pointer;
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.97);}
  .btn:hover{border-color:var(--gold-dim);}
  .btn.primary{
    background:linear-gradient(180deg,var(--gold),#b6883a);
    color:#241a08;
    border:1px solid #7a5f28;
  }
  .btn.primary:hover{border-color:#f0cd85;}
  .btn.danger{
    background:linear-gradient(180deg,var(--ember-bright),var(--ember));
    color:#2a0d06;
    border:1px solid #7a2c1c;
  }
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  .btn.block{width:100%;}
  /* ---------- Map ---------- */
  .map-title{display:flex;justify-content:space-between;align-items:baseline;}
  .map-title h2{color:var(--gold);font-size:1.15rem;}
  .map-title span{color:var(--ink-dim);font-size:.8rem;}
  .map-track{
    position:relative;
    display:flex;
    flex-direction:column-reverse;
    gap:26px;
    padding:10px 4px 4px;
  }
  .map-row{
    display:flex;
    justify-content:space-evenly;
    gap:10px;
  }
  .node{
    width:64px;height:64px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--bg-panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:1.35rem;
    cursor:pointer;
    position:relative;
    color:var(--ink-dim);
    transition:border-color .15s, transform .1s, box-shadow .15s;
  }
  .node .node-label{font-size:.55rem;font-family:'Cinzel',serif;margin-top:1px;letter-spacing:.02em;}
  .node.reachable{border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(217,168,78,.15);}
  .node.reachable:active{transform:scale(.94);}
  .node.done{border-color:var(--moss);opacity:.55;}
  .node.current{border-color:var(--gold);box-shadow:0 0 14px rgba(217,168,78,.5);}
  .node.locked{opacity:.32;}
  .node.boss{width:78px;height:78px;font-size:1.6rem;border-color:var(--ember);}
  .node.boss.reachable{box-shadow:0 0 0 3px rgba(224,90,60,.2);border-color:var(--ember-bright);}
  .node{z-index:1;}
  .map-edges{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .edge-dim{stroke:var(--line);stroke-width:2;opacity:.55;}
  .edge-active{stroke:var(--gold);stroke-width:3;opacity:.95;}
  .edge-done{stroke:var(--moss-bright);stroke-width:2.5;opacity:.8;}
  /* ---------- Class select ---------- */
  .class-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .class-card{
    width:190px;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .class-card:hover{border-color:var(--gold);}
  .class-card:active{transform:scale(.97);}
  .class-icon{font-size:1.8rem;margin-bottom:6px;}
  .class-name{font-family:'Cinzel',serif;color:var(--gold);font-size:.95rem;margin-bottom:6px;}
  .class-desc{font-size:.75rem;color:var(--ink-dim);line-height:1.5;margin-bottom:8px;}
  .class-stats{font-size:.72rem;color:var(--ink);margin-bottom:6px;}
  .class-deck{font-size:.65rem;color:var(--ink-dim);line-height:1.5;}
  /* ---------- Battle ---------- */
  .combat-field{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .fighter{
    flex:1;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    text-align:center;
    position:relative;
  }
  .fighter.enemy{border-color:#4a2c2c;}
  .fighter .name{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);margin-bottom:6px;}
  .hp-bar-wrap{background:#100c1a;border-radius:20px;height:14px;overflow:hidden;border:1px solid var(--line);}
  .hp-bar{height:100%;background:linear-gradient(90deg,var(--moss),var(--moss-bright));transition:width .3s ease;}
  .fighter.enemy .hp-bar{background:linear-gradient(90deg,#8a3226,var(--ember-bright));}
  .hp-text{font-size:.72rem;color:var(--ink-dim);margin-top:4px;}
  .badge-row{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .badge{
    font-size:.68rem;
    padding:3px 8px;
    border-radius:20px;
    background:#241c38;
    border:1px solid var(--line);
    color:var(--ink-dim);
  }
  .badge.block{color:#9cc8e0;border-color:#2e4a5c;}
  .badge.poison{color:#a3d19c;border-color:#33502e;}
  .intent{
    margin-top:8px;
    font-size:.78rem;
    color:var(--ember-bright);
    font-family:'Cinzel',serif;
  }
  .energy-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }
  .energy-orb{
    font-family:'Cinzel',serif;
    background:radial-gradient(circle at 35% 30%, #fce6a8, var(--gold) 60%, var(--gold-dim));
    color:#241a08;
    border-radius:50%;
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.1rem;
    box-shadow:0 0 10px rgba(217,168,78,.35);
  }
  .hand{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:6px 2px 10px;
    scroll-snap-type:x proximity;
  }
  .card{
    scroll-snap-align:start;
    flex:0 0 108px;
    min-height:150px;
    background:linear-gradient(180deg,#231d38,#181229);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 8px;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s;
    position:relative;
  }
  .card:active{transform:translateY(-4px);}
  .card.playable{border-color:var(--gold-dim);}
  .card.playable:hover{border-color:var(--gold);transform:translateY(-6px);}
  .card.unplayable{opacity:.4;cursor:not-allowed;}
  .card .cost{
    position:absolute;top:6px;left:6px;
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#241a08;
    font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;
    display:flex;align-items:center;justify-content:center;
  }
  .card .cname{
    font-family:'Cinzel',serif;font-size:.72rem;
    margin-top:20px;color:var(--ink);line-height:1.25;
  }
  .card .ctype{font-size:.6rem;color:var(--ink-dim);margin-top:auto;text-transform:uppercase;letter-spacing:.04em;}
  .card .cdesc{font-size:.65rem;color:var(--ink-dim);margin-top:6px;line-height:1.4;flex:1;}
  .log-box{
    background:#0f0c19;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-size:.72rem;
    color:var(--ink-dim);
    max-height:64px;
    overflow-y:auto;
  }
  .actions-row{display:flex;gap:10px;justify-content:center;}
  /* ---------- Reward / Rest / Shop ---------- */
  .reward-cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .center-text{text-align:center;color:var(--ink-dim);font-size:.88rem;line-height:1.6;}
  .gold-line{color:var(--gold);font-family:'Cinzel',serif;text-align:center;font-size:1rem;}
  .shop-list{display:flex;flex-direction:column;gap:10px;}
  .shop-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg-panel-2);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;gap:10px;
  }
  .shop-item .desc{font-size:.78rem;color:var(--ink-dim);flex:1;}
  .shop-item .desc b{color:var(--ink);}
  /* ---------- Game over ---------- */
  .gameover h2{color:var(--ember-bright);font-size:1.6rem;text-align:center;}
  .final-stats{display:flex;justify-content:center;gap:24px;}
  .final-stats div{text-align:center;}
  .final-stats .n{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--gold);}
  .final-stats .l{font-size:.72rem;color:var(--ink-dim);}
  @media (max-width:420px){
    .node{width:54px;height:54px;font-size:1.15rem;}
    .node.boss{width:66px;height:66px;font-size:1.4rem;}
    .card{flex-basis:96px;min-height:138px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================== 데이터 ============================== */

const CARD_LIB = {
  strike:   {name:"타격", cost:1, type:"공격", desc:"6의 피해를 입힌다.", play:(s,e)=>{dealDamage(e,6,s);}},
  defend:   {name:"방어", cost:1, type:"방어", desc:"방어도 5를 얻는다.", play:(s)=>{s.block+=5;}},
  heavyStrike:{name:"강타", cost:2, type:"공격", desc:"14의 피해를 입힌다.", play:(s,e)=>{dealDamage(e,14,s);}},
  twinStrike:{name:"이단 베기", cost:1, type:"공격", desc:"4의 피해를 2회 입힌다.", play:(s,e)=>{dealDamage(e,4,s);dealDamage(e,4,s);}},
  quickSlash:{name:"연속 찌르기", cost:0, type:"공격", desc:"3의 피해를 입힌다.", play:(s,e)=>{dealDamage(e,3,s);}},
  ironWall: {name:"철벽", cost:1, type:"방어", desc:"방어도 8을 얻는다.", play:(s)=>{s.block+=8;}},
  battleFocus:{name:"전투 집중", cost:1, type:"방어", desc:"방어도 4를 얻고 카드 1장을 뽑는다.", play:(s)=>{s.block+=4;drawCards(1);}},
  poisonDagger:{name:"독 단검", cost:1, type:"공격", desc:"5의 피해 + 중독 3.", play:(s,e)=>{dealDamage(e,5,s);e.poison=(e.poison||0)+3;}},
  secondWind:{name:"숨 고르기", cost:2, type:"방어", desc:"체력 8 회복, 방어도 5.", play:(s)=>{s.hp=Math.min(s.maxHp,s.hp+8);s.block+=5;}},
  cleave:   {name:"휩쓸기", cost:1, type:"공격", desc:"9의 피해를 입힌다.", play:(s,e)=>{dealDamage(e,9,s);}},
  fortify:  {name:"굳히기", cost:2, type:"방어", desc:"방어도 12를 얻는다.", play:(s)=>{s.block+=12;}},
  bloodRite:{name:"혈맹의 대가", cost:1, type:"공격", desc:"체력 3을 잃고 11의 피해를 입힌다.", play:(s,e)=>{s.hp=Math.max(1,s.hp-3);dealDamage(e,11,s);}},
  adrenaline:{name:"아드레날린", cost:0, type:"방어", desc:"카드 2장을 뽑는다.", play:()=>{drawCards(2);}},
  // ---- 마법사 계열: 소멸(exhaust) 자원을 태워 위력을 키우는 마법 ----
  fireBolt:{name:"화염탄", cost:1, type:"마법", desc:"5의 피해 + 소멸한 카드 수 × 2 추가 피해.",
    descFn:s=>`피해 ${5+2*(s.exhaustCount||0)} (기본 5 + 소멸 ${s.exhaustCount||0}장×2)`,
    play:(s,e)=>{dealDamage(e, 5+2*(s.exhaustCount||0), s);}},
  manaShield:{name:"마력 방벽", cost:1, type:"방어", desc:"방어도 7을 얻는다.", play:(s)=>{s.block+=7;}},
  arcaneStudy:{name:"비전 탐구", cost:1, type:"마법", desc:"카드 2장을 뽑는다. (사용 후 소멸)", exhaustsSelf:true,
    play:()=>{drawCards(2);}},
  essenceDrain:{name:"정수 흡수", cost:0, type:"마법", desc:"방어도 3을 얻는다. (사용 후 소멸)", exhaustsSelf:true,
    play:(s)=>{s.block+=3;}},
  // ---- 도적 계열: 속도와 연계로 딜을 뽑는 카드 ----
  backstab:{name:"기습", cost:1, type:"공격", desc:"10의 피해를 입힌다.", play:(s,e)=>{dealDamage(e,10,s);}},
  comboStrike:{name:"연계 타격", cost:1, type:"공격", desc:"이번 턴 사용한 카드 수 × 2의 피해를 입힌다.",
    descFn:s=>`피해 ${2*(((s.cardsPlayedThisTurn||0))+1)} 예상 (이번 턴 ${((s.cardsPlayedThisTurn||0))+1}번째 카드 기준)`,
    play:(s,e)=>{dealDamage(e, 2*(s.cardsPlayedThisTurn||1), s);}},
  // ---- 전사 및 공용 계열: 방어도를 자원으로 쓰는 카드 ----
  riposte:{name:"받아치기", cost:1, type:"공격", desc:"현재 보유한 방어도만큼 피해를 입힌다.",
    descFn:s=>`피해 ${s.block||0} (현재 방어도만큼, 방어도는 유지)`,
    play:(s,e)=>{dealDamage(e, s.block||0, s);}},
};

const COMMON_POOL = ["ironWall","secondWind","adrenaline","riposte"];
const CLASS_POOLS = {
  warrior: ["heavyStrike","cleave","fortify","bloodRite","twinStrike","riposte"],
  rogue:   ["quickSlash","twinStrike","poisonDagger","backstab","comboStrike","adrenaline"],
  mage:    ["fireBolt","manaShield","arcaneStudy","essenceDrain","battleFocus"]
};

const CLASSES = {
  warrior:{name:"전사", icon:"⚔", hp:80,
    desc:"굳건한 방패와 강한 일격으로 정면에서 맞서는 계열. 이후에도 강력한 단일 타격과 방어 카드 위주로 성장한다.",
    deck:["strike","strike","strike","strike","defend","defend","defend","defend","heavyStrike"]},
  rogue:{name:"도적", icon:"🗡", hp:65,
    desc:"빠른 연속 공격과 독으로 상대를 무너뜨리는 계열. 이후 저비용 카드와 연계 피해 위주로 성장한다.",
    deck:["quickSlash","quickSlash","quickSlash","strike","strike","defend","defend","poisonDagger","adrenaline"]},
  mage:{name:"마법사", icon:"✦", hp:58,
    desc:"카드를 소멸시켜 그 힘을 모아 강력한 마력을 터뜨리는 계열. 이후 소멸 시너지 마법 위주로 성장한다.",
    deck:["fireBolt","fireBolt","manaShield","manaShield","strike","defend","arcaneStudy","essenceDrain"]}
};

function rewardPoolForClass(){
  const klass = S.player && S.player.klass;
  const classPool = CLASS_POOLS[klass] || [];
  return [...classPool, ...classPool, ...COMMON_POOL];
}

function sampleUnique(weightedArr, n){
  const seen = new Set();
  const out = [];
  for(const k of shuffle(weightedArr)){
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(k);
    if(out.length>=n) break;
  }
  return out;
}

function cardDesc(key){
  const c = CARD_LIB[key];
  return (S.player && typeof c.descFn==="function") ? c.descFn(S.player) : c.desc;
}

const ENEMY_NAMES = ["동굴 박쥐","곰팡이 슬라임","녹슨 파수병","그림자 늑대","뼈다귀 도적","독니 거미"];
const ELITE_NAMES = ["사슬 감시자","불타는 골렘","심연의 사도"];
const BOSS_NAMES = ["균열의 파수왕","심연의 대군주","잊혀진 옥좌의 주인","끝없는 굶주림","태고의 파괴자"];
const EVENTS = [
  {text:"버려진 제단에서 낯선 기운이 느껴진다.",
   options:[
     {label:"제물을 바친다 (체력 -8, 골드 +25)", apply:s=>{s.player.hp=Math.max(1,s.player.hp-8);s.player.gold+=25;return "체력을 바치고 금화를 얻었다.";}},
     {label:"그냥 지나친다", apply:()=>"조용히 자리를 떠났다."}
   ]},
  {text:"부상당한 방랑자가 도움을 청한다.",
   options:[
     {label:"치료해준다 (체력 +12)", apply:s=>{s.player.hp=Math.min(s.player.maxHp,s.player.hp+12);return "방랑자를 치료하고 원기를 되찾았다.";}},
     {label:"외면한다 (골드 +15)", apply:s=>{s.player.gold+=15;return "방랑자의 소지품을 챙겼다.";}}
   ]},
  {text:"오래된 상자를 발견했다. 잠겨 있는 듯하다.",
   options:[
     {label:"억지로 연다 (체력 -5, 카드 획득)", apply:s=>{s.player.hp=Math.max(1,s.player.hp-5);addRandomCardToDeck();return "상자를 부수고 카드를 얻었다.";}},
     {label:"두고 간다", apply:()=>"상자를 그대로 두었다."}
   ]}
];

/* ============================== 상태 ============================== */

let S = null; // 전역 게임 상태

function newRun(){
  S = {
    screen:"intro",
    floor:0,               // 현재 층 (1부터 시작)
    act:0,                 // floor를 5로 나눈 구간
    map:null,
    currentNodeId:null,
    player:null,           // 계열 선택 후 생성
    enemy:null,
    hand:[], drawPile:[], discardPile:[],
    energy:3, maxEnergy:3,
    turn:"player",
    log:[],
    rewardOptions:null,
    pendingGold:0,
    eventData:null,
    shopStock:null,
    best: Number(localStorage.getItem("depthcrawler_best")||0)
  };
}

function startClass(key){
  const c = CLASSES[key];
  if(!c) return;
  S.player = {
    klass:key,
    hp:c.hp, maxHp:c.hp, gold:99, block:0,
    deck:[...c.deck],
    exhaustCount:0,
    cardsPlayedThisTurn:0
  };
  S.act = 0; S.floor = 0;
  startAct();
  S.screen = "map";
  render();
}

function logMsg(m){
  S.log.unshift(m);
  if(S.log.length>40) S.log.pop();
}

/* ============================== 맵 생성 ============================== */

function buildAct(){
  // 4개 일반 줄 + 보스 줄
  const rowsCount = [2,3,3,2];
  const rows = [];
  rowsCount.forEach((n,i)=>{
    const row = [];
    for(let j=0;j<n;j++){
      let type;
      if(i===0){
        type = pick(["battle","battle","battle","event"]);
      } else if(i===rowsCount.length-1){
        type = pick(["battle","rest","shop"]);
      } else {
        type = pick(["battle","battle","elite","event","shop","rest"]);
      }
      row.push({id:`${i}-${j}`, row:i, col:j, type, done:false});
    }
    rows.push(row);
  });
  // 보스 줄
  rows.push([{id:`${rowsCount.length}-0`, row:rowsCount.length, col:0, type:"boss", done:false}]);

  // 연결: 각 노드는 다음 줄에서 가까운 col 1~2개에 연결
  for(let i=0;i<rows.length-1;i++){
    const cur = rows[i], next = rows[i+1];
    cur.forEach(node=>{
      const targets = new Set();
      const ratio = node.col/(Math.max(cur.length-1,1));
      const approx = Math.round(ratio*(next.length-1));
      targets.add(clamp(approx,0,next.length-1));
      if(next.length>1){
        targets.add(clamp(approx + (Math.random()<0.5?-1:1),0,next.length-1));
      }
      node.next = Array.from(targets).map(c=>next[c].id);
    });
  }
  return {rows, rowsCount: rows.length};
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function startAct(){
  S.map = buildAct();
  S.currentNodeId = null;
}

/* ============================== 전투 스케일링 ============================== */

function scaledEnemy(kind){
  const floor = S.floor, act = S.act;
  if(kind==="boss"){
    const hp = 55 + act*35;
    const atk = 9 + act*4;
    return {name:pick(BOSS_NAMES), hp, maxHp:hp, atk, block:0, poison:0, isBoss:true, phase:0};
  }
  if(kind==="elite"){
    const hp = 32 + floor*4 + act*10;
    const atk = 7 + Math.floor(floor/2) + act*2;
    return {name:pick(ELITE_NAMES), hp, maxHp:hp, atk, block:0, poison:0, isElite:true};
  }
  const hp = 16 + floor*3 + act*4;
  const atk = 4 + Math.floor(floor/3) + act;
  return {name:pick(ENEMY_NAMES), hp, maxHp:hp, atk, block:0, poison:0};
}

function rollIntent(enemy){
  // 간단한 의도: 대부분 공격, 가끔 방어, 보스는 강공격 패턴 섞임
  const r = Math.random();
  if(enemy.isBoss){
    if(r<0.25){ enemy.intent={type:"guard", val: Math.round(enemy.atk*0.8)}; }
    else if(r<0.55){ enemy.intent={type:"attack", val: Math.round(enemy.atk*1.6)}; }
    else { enemy.intent={type:"attack", val: enemy.atk}; }
  } else {
    if(r<0.2){ enemy.intent={type:"guard", val: Math.round(enemy.atk*0.7)}; }
    else { enemy.intent={type:"attack", val: enemy.atk}; }
  }
}

/* ============================== 전투 로직 ============================== */

function enterBattle(node){
  const kind = node.type==="boss"?"boss":(node.type==="elite"?"elite":"battle");
  S.enemy = scaledEnemy(kind);
  rollIntent(S.enemy);
  S.player.block = 0;
  S.player.exhaustCount = 0;
  S.player.cardsPlayedThisTurn = 0;
  S.drawPile = shuffle([...S.player.deck]);
  S.discardPile = [];
  S.hand = [];
  S.energy = S.maxEnergy;
  S.turn = "player";
  S.log = [];
  logMsg(`${S.enemy.name}이(가) 나타났다!`);
  drawCards(5);
  S.screen = "battle";
  render();
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function drawCards(n){
  for(let i=0;i<n;i++){
    if(S.drawPile.length===0){
      if(S.discardPile.length===0) return;
      S.drawPile = shuffle(S.discardPile);
      S.discardPile = [];
      logMsg("버린 카드를 섞어 다시 뽑는다.");
    }
    S.hand.push(S.drawPile.pop());
  }
}

function dealDamage(target, amount, source){
  let dmg = amount;
  if(target.block>0){
    const absorbed = Math.min(target.block, dmg);
    target.block -= absorbed;
    dmg -= absorbed;
  }
  if(dmg>0) target.hp = Math.max(0, target.hp - dmg);
}

function playCard(idx){
  if(S.turn!=="player") return;
  const cardKey = S.hand[idx];
  const card = CARD_LIB[cardKey];
  if(!card || S.energy < card.cost) return;
  S.energy -= card.cost;
  S.player.cardsPlayedThisTurn = (S.player.cardsPlayedThisTurn||0) + 1;
  card.play(S.player, S.enemy);
  logMsg(`${card.name} 사용.`);
  S.hand.splice(idx,1);
  if(card.exhaustsSelf){
    S.player.exhaustCount = (S.player.exhaustCount||0) + 1;
    logMsg(`${card.name}이(가) 소멸했다.`);
  } else {
    S.discardPile.push(cardKey);
  }

  if(S.enemy.hp<=0){
    winBattle();
    return;
  }
  render();
}

function endPlayerTurn(){
  if(S.turn!=="player") return;
  S.turn = "enemy";
  render();
  setTimeout(enemyTurn, 550);
}

function enemyTurn(){
  const e = S.enemy;
  if(!e || e.hp<=0) return;
  if(e.poison>0){
    e.hp = Math.max(0, e.hp - e.poison);
    logMsg(`${e.name}이(가) 중독 피해 ${e.poison}을 입었다.`);
    e.poison = Math.max(0, e.poison-1);
    if(e.hp<=0){ winBattle(); return; }
  }
  const intent = e.intent;
  if(intent.type==="attack"){
    dealDamage(S.player, intent.val, e);
    logMsg(`${e.name}의 공격! ${intent.val}의 피해.`);
  } else {
    e.block += intent.val;
    logMsg(`${e.name}이(가) 방어 태세를 취한다.`);
  }
  if(S.player.hp<=0){
    S.screen="gameover";
    updateBest();
    render();
    return;
  }
  // 다음 턴 준비
  S.player.block = 0;
  S.player.cardsPlayedThisTurn = 0;
  S.discardPile.push(...S.hand);
  S.hand = [];
  S.energy = S.maxEnergy;
  rollIntent(e);
  drawCards(5);
  S.turn = "player";
  render();
}

function winBattle(){
  logMsg(`${S.enemy.name}을(를) 쓰러뜨렸다!`);
  const goldGain = S.enemy.isBoss? (60+S.act*20) : S.enemy.isElite? (30+S.floor*2) : (12+S.floor);
  S.pendingGold = goldGain;
  S.player.gold += goldGain;
  const options = sampleUnique(rewardPoolForClass(), 3);
  S.rewardOptions = options;
  S.screen = "reward";
  render();
}

/* ============================== 노드 진행 ============================== */

function addRandomCardToDeck(){
  const k = pick(rewardPoolForClass());
  S.player.deck.push(k);
}

function reachableNodeIds(){
  if(!S.currentNodeId){
    // 첫 줄 전체가 시작 가능
    return S.map.rows[0].map(n=>n.id);
  }
  const cur = findNode(S.currentNodeId);
  return cur ? cur.next : [];
}

function findNode(id){
  for(const row of S.map.rows) for(const n of row) if(n.id===id) return n;
  return null;
}

function chooseNode(id){
  const node = findNode(id);
  if(!node) return;
  const reach = reachableNodeIds();
  if(!reach.includes(id)) return;

  S.currentNodeId = id;
  node.done = true;
  S.floor += 1;

  if(node.type==="battle" || node.type==="elite" || node.type==="boss"){
    enterBattle(node);
  } else if(node.type==="rest"){
    S.screen = "rest";
    render();
  } else if(node.type==="shop"){
    S.screen = "shop";
    S.shopStock = generateShopStock();
    render();
  } else if(node.type==="event"){
    S.eventData = pick(EVENTS);
    S.screen = "event";
    render();
  }
}

function generateShopStock(){
  return sampleUnique(rewardPoolForClass(), 3).map(k=>({key:k, price: 18 + Math.floor(Math.random()*20)}));
}

function afterNodeResolved(){
  // 보스를 처치했으면 다음 Act로
  const cur = findNode(S.currentNodeId);
  if(cur && cur.type==="boss"){
    S.act += 1;
    startAct();
  }
  S.screen = "map";
  render();
}

function updateBest(){
  if(S.floor > S.best){
    S.best = S.floor;
    localStorage.setItem("depthcrawler_best", String(S.best));
  }
}

/* ============================== 렌더링 ============================== */

const app = document.getElementById("app");

function render(){
  let html = "";
  html += renderTopbar();

  else if(S.screen==="map") html += renderMap();
  else if(S.screen==="battle") html += renderBattle();
  else if(S.screen==="reward") html += renderReward();
  else if(S.screen==="rest") html += renderRest();
  else if(S.screen==="shop") html += renderShop();
  else if(S.screen==="event") html += renderEvent();
  else if(S.screen==="gameover") html += renderGameOver();

  if(S.screen==="map"){ requestAnimationFrame(drawMapEdges); }
}

function renderMap(){
  const reach = reachableNodeIds();
  const iconOf = t=>({battle:"⚔",elite:"☠",rest:"🔥",shop:"⚖",event:"❔",boss:"👑"}[t]||"?");
  const labelOf = t=>({battle:"전투",elite:"정예",rest:"휴식",shop:"상점",event:"사건",boss:"강적"}[t]||"");
  let rowsHtml = "";
  S.map.rows.forEach(row=>{
    rowsHtml += `<div class="map-row">`;
    row.forEach(n=>{
      let cls = "node";
      if(n.type==="boss") cls += " boss";
      if(n.done) cls += " done";
      else if(reach.includes(n.id)) cls += " reachable";
      else cls += " locked";
      if(n.id===S.currentNodeId) cls += " current";
      rowsHtml += `<div class="${cls}" data-node="${n.id}"><div>${iconOf(n.type)}</div><div class="node-label">${labelOf(n.type)}</div></div>`;
    });
    rowsHtml += `</div>`;
  });
  return `
  <div class="screen">
    <div class="map-title"><h2>Act ${S.act+1} — 갈림길</h2><span>덱 ${S.player.deck.length}장</span></div>
    <div class="map-track"><svg class="map-edges"></svg>${rowsHtml}</div>
  </div>`;
}

function drawMapEdges(){
  const track = document.querySelector(".map-track");
  if(!track || !S.map) return;
  const svg = track.querySelector(".map-edges");
  if(!svg) return;
  const rect = track.getBoundingClientRect();
  if(rect.width===0) return;
  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
  svg.innerHTML = "";
  const centers = {};
  track.querySelectorAll(".node").forEach(el=>{
    const r = el.getBoundingClientRect();
    centers[el.dataset.node] = {x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2};
  });
  const reach = reachableNodeIds();
  const ns = "http://www.w3.org/2000/svg";
  S.map.rows.forEach(row=>{
    row.forEach(n=>{
      (n.next||[]).forEach(nid=>{
        const a = centers[n.id], b = centers[nid];
        if(!a || !b) return;
        const nextNode = findNode(nid);
        let cls = "edge-dim";
        if(n.done && nextNode && nextNode.done) cls = "edge-done";
        else if(n.id===S.currentNodeId && reach.includes(nid)) cls = "edge-active";
        const line = document.createElementNS(ns,"line");
        line.setAttribute("x1",a.x); line.setAttribute("y1",a.y);
        line.setAttribute("x2",b.x); line.setAttribute("y2",b.y);
        line.setAttribute("class",cls);
        svg.appendChild(line);
      });
    });
  });
}
window.addEventListener("resize", ()=>{ if(S && S.screen==="map") drawMapEdges(); });

    </div>
    <div class="actions-row"><button class="btn primary" data-action="restart">다시 하강하기</button></div>
  </div>`;
}

/* ============================== 이벤트 바인딩 ============================== */

function bindEvents(){
  app.querySelectorAll("[data-action='begin']").forEach(b=>b.onclick=()=>{
    S.screen="classselect"; render();
  });
  app.querySelectorAll("[data-class]").forEach(b=>b.onclick=()=>startClass(b.dataset.class));
  app.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>chooseNode(b.dataset.node));
  app.querySelectorAll("[data-hand-idx]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("unplayable")) return;
    playCard(Number(b.dataset.handIdx));
  });
  app.querySelectorAll("[data-action='endturn']").forEach(b=>b.onclick=endPlayerTurn);
  app.querySelectorAll("[data-reward-idx]").forEach(b=>b.onclick=()=>{
    const k = S.rewardOptions[Number(b.dataset.rewardIdx)];
    S.player.deck.push(k);
    afterNodeResolved();
  });
  app.querySelectorAll("[data-action='skip-reward']").forEach(b=>b.onclick=afterNodeResolved);
  app.querySelectorAll("[data-action='rest-heal']").forEach(b=>b.onclick=()=>{
    S.player.hp = Math.min(S.player.maxHp, S.player.hp + Math.round(S.player.maxHp*0.3));
    afterNodeResolved();
  });
  app.querySelectorAll("[data-shop-idx]").forEach(b=>b.onclick=()=>{
    const it = S.shopStock[Number(b.dataset.shopIdx)];
    if(S.player.gold<it.price) return;
    S.player.gold -= it.price;
    S.player.deck.push(it.key);
    S.shopStock.splice(Number(b.dataset.shopIdx),1);
    render();
  });
  app.querySelectorAll("[data-shop-heal]").forEach(b=>b.onclick=()=>{
    if(S.player.gold<25) return;
    S.player.gold -= 25;
    S.player.hp = Math.min(S.player.maxHp, S.player.hp+20);
    render();
  });
  app.querySelectorAll("[data-action='leave-shop']").forEach(b=>b.onclick=afterNodeResolved);
  app.querySelectorAll("[data-event-idx]").forEach(b=>b.onclick=()=>{
    const opt = S.eventData.options[Number(b.dataset.eventIdx)];
    const msg = opt.apply(S);
    afterNodeResolved();
  });
  app.querySelectorAll("[data-action='restart']").forEach(b=>b.onclick=()=>{
    newRun();
    render();
  });
}

/* ============================== 시작 ============================== */

newRun();
render();

})();
</script>
</body>
</html>
